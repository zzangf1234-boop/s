plugins {
    id 'com.android.application'
}

android {
    namespace 'com.store.didcall'
    compileSdk 34

    defaultConfig {
        applicationId 'com.store.didcall'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 별도 서명 키 없이 바로 설치할 수 있도록 디버그 키로 서명
            signingConfig signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// 외부 라이브러리 없이 안드로이드 기본 API만 사용합니다.
dependencies {
}
