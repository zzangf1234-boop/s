plugins {
    id 'com.android.application'
}

// versionCode: GitHub Actions 빌드 번호로 자동 증가 (덮어 설치 순서 보장)
def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()
// versionName: 저장소 맨 위 VERSION 파일 (새 기능 = 0.1 올림 → x.(y+1).0 / 수정·오류 = 0.0.1 올림 → x.y.(z+1))
def appVersion = rootProject.file("VERSION").exists() ? rootProject.file("VERSION").text.trim() : "1.2.0"

// 정식 서명 키: app/release.p12 (비밀번호로 암호화), 비밀번호는 GitHub Secrets 의 DID_KEYSTORE_PASSWORD
def releaseKeystore = file("release.p12")
def keystorePassword = System.getenv("DID_KEYSTORE_PASSWORD")
def hasReleaseKey = keystorePassword != null && !keystorePassword.isEmpty() && releaseKeystore.exists()

android {
    namespace 'com.store.didcall'
    compileSdk 34

    defaultConfig {
        applicationId 'com.store.didcall'
        minSdk 21
        targetSdk 34
        versionCode 100 + runNumber
        versionName appVersion
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile releaseKeystore
                storeType 'pkcs12'
                storePassword keystorePassword
                keyAlias 'didcall'
                keyPassword keystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 정식 키가 있으면 정식 키로, 없으면(개발용) 테스트 키로 서명
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// 외부 라이브러리 없이 안드로이드 기본 API만 사용합니다.
dependencies {
}
