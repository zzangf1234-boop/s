name: APK 빌드

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # 처음 한 번 서명 키 파일을 저장소에 저장하기 위해 필요

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 정식 서명 키 준비
      #  - 비밀번호: 저장소 Settings → Secrets and variables → Actions → DID_KEYSTORE_PASSWORD
      #  - main 브랜치에서 키 파일이 없으면 처음 한 번 생성해 저장소에 저장 (비밀번호로 암호화된 파일)
      #  - 비밀번호가 없거나 main 이 아닌 브랜치는 테스트 키로 서명 (덮어 설치 불가, 개발 확인용)
      - name: 서명 키 준비
        env:
          DID_KEYSTORE_PASSWORD: ${{ secrets.DID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$DID_KEYSTORE_PASSWORD" ]; then
            echo "::warning::DID_KEYSTORE_PASSWORD 비밀값이 없어 테스트 키로 서명합니다 (덮어 설치 불가)"
            echo "APK_NAME=DID-Call-TEST.apk" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ ${#DID_KEYSTORE_PASSWORD} -lt 12 ]; then
            echo "::error::DID_KEYSTORE_PASSWORD 는 12자 이상이어야 합니다"
            exit 1
          fi
          if [ ! -f app/release.p12 ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::warning::서명 키는 main 브랜치에서만 만듭니다. 이 빌드는 테스트 키로 서명합니다"
              echo "APK_NAME=DID-Call-TEST.apk" >> "$GITHUB_ENV"
              echo "DID_SKIP_RELEASE_KEY=1" >> "$GITHUB_ENV"
              exit 0
            fi
            keytool -genkeypair -keystore app/release.p12 -storetype PKCS12 \
              -storepass:env DID_KEYSTORE_PASSWORD -keypass:env DID_KEYSTORE_PASSWORD \
              -alias didcall -keyalg RSA -keysize 3072 -validity 36500 \
              -dname "CN=DID Call, C=KR"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/release.p12
            git commit -m "정식 서명 키 생성 (비밀번호로 암호화됨) [skip ci]"
            git push
          fi
          echo "APK_NAME=DID-Call.apk" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          DID_KEYSTORE_PASSWORD: ${{ env.DID_SKIP_RELEASE_KEY != '1' && secrets.DID_KEYSTORE_PASSWORD || '' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/$APK_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: DID-number-call-apk
          path: out/*.apk
