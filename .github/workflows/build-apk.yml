name: APK 빌드

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/DID-Call.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DID-number-call-apk
          path: out/*.apk
