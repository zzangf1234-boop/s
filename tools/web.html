<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DID 번호호출</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#111418;color:#f2f2f2;display:flex;flex-direction:column;min-height:100vh;padding:14px;gap:10px;max-width:520px;margin:0 auto}
.now{font-size:14px;color:#9aa3ad;display:flex;justify-content:space-between}
.now b{color:#ffcc33;font-size:18px}
#disp{background:#000;border-radius:14px;text-align:center;font-size:64px;font-weight:800;padding:10px;min-height:96px;letter-spacing:4px;color:#ffcc33}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1}
button{border:0;border-radius:14px;font-size:28px;font-weight:700;padding:16px 0;background:#262b31;color:#fff}
button:active{filter:brightness(1.4)}
.call{background:#ff8a00;font-size:30px;padding:20px 0}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row button{font-size:17px;background:#33404d}
#msg{text-align:center;font-size:14px;color:#9aa3ad;min-height:18px}
details{font-size:14px;color:#9aa3ad}
details input{width:100%;padding:10px;border-radius:8px;border:0;margin:4px 0 8px;font-size:15px}
details button{font-size:16px;padding:10px;width:100%;background:#33404d}
</style></head><body>
<div class="now"><span>현재 호출 <b id="cur">-</b></span><span id="hist"></span></div>
<div id="disp"></div>
<div class="pad">
<button onclick="k('1')">1</button><button onclick="k('2')">2</button><button onclick="k('3')">3</button>
<button onclick="k('4')">4</button><button onclick="k('5')">5</button><button onclick="k('6')">6</button>
<button onclick="k('7')">7</button><button onclick="k('8')">8</button><button onclick="k('9')">9</button>
<button onclick="del()">←</button><button onclick="k('0')">0</button><button onclick="v='';show()">C</button>
</div>
<button class="call" onclick="callNum()">호출</button>
<div class="row"><button onclick="api('/recall')">재호출</button><button onclick="next()">다음 번호</button><button onclick="api('/clear')">화면 비우기</button></div>
<div id="msg"></div>
<details><summary>TV 안내 설정</summary>
음성 문구 ({n} 자리에 번호)<input id="tts">
화면 안내 문구<input id="sub">
반복 횟수 (0~5)<input id="rep" type="number" min="0" max="5">
<button onclick="saveCfg()">저장</button>
</details>
<script>
var v='',last=0,loaded=false;
function show(){document.getElementById('disp').textContent=v}
function k(d){if(v.length<6){v+=d;show()}}
function del(){v=v.slice(0,-1);show()}
function msg(t){document.getElementById('msg').textContent=t}
function render(s){
 document.getElementById('cur').textContent=s.current||'-';
 document.getElementById('hist').textContent=(s.history||[]).slice(0,4).join(' · ');
 if(!loaded){document.getElementById('tts').value=s.tts;document.getElementById('sub').value=s.sub;document.getElementById('rep').value=s.repeat;loaded=true}
}
function api(p){return fetch(p).then(function(r){return r.json()}).then(function(s){render(s);if(!s.ok)msg(s.error||'오류');return s}).catch(function(){msg('TV에 연결할 수 없습니다')})}
function callNum(){if(!v){msg('번호를 입력하세요');return}var n=v;api('/call?n='+encodeURIComponent(n)).then(function(s){if(s&&s.ok){msg(n+'번 호출 완료');last=parseInt(n,10)||last;v='';show()}})}
function next(){v=String((last||parseInt(document.getElementById('cur').textContent,10)||0)+1);show()}
function saveCfg(){api('/config?tts='+encodeURIComponent(document.getElementById('tts').value)+'&sub='+encodeURIComponent(document.getElementById('sub').value)+'&repeat='+document.getElementById('rep').value).then(function(){msg('설정 저장됨')})}
api('/status');setInterval(function(){fetch('/status').then(function(r){return r.json()}).then(render).catch(function(){})},3000);
</script></body></html>
