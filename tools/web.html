<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DID 번호호출</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#111418;color:#f2f2f2;display:flex;flex-direction:column;min-height:100vh;padding:14px;gap:10px;max-width:520px}
.now{font-size:14px;color:#9aa3ad;display:flex;justify-content:space-between}
.now b{color:#ffcc33;font-size:18px}
#disp{background:#000;border-radius:14px;text-align:center;font-size:64px;font-weight:800;padding:10px;min-height:96px;letter-spacing:4px;color:#ffcc33}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{border:0;border-radius:14px;font-size:28px;font-weight:700;padding:16px 0;background:#262b31;color:#fff;font-family:inherit}
button:active{filter:brightness(1.4)}
.call{background:#ff8a00;font-size:30px;padding:20px 0}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row button{font-size:17px;background:#33404d}
#msg{text-align:center;font-size:14px;color:#9aa3ad;min-height:18px}
details{font-size:14px;color:#9aa3ad;background:#1c2127;border-radius:14px;padding:12px}
summary{font-size:16px;font-weight:700;color:#f2f2f2;cursor:pointer}
details input,details select{width:100%;padding:10px;border-radius:8px;border:0;margin:4px 0 10px;font-size:15px;font-family:inherit}
details button{font-size:16px;padding:12px;width:100%;background:#33404d;margin-top:4px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.thumb{position:relative;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:3px;right:3px;width:28px;height:28px;padding:0;font-size:16px;border-radius:50%;background:rgba(0,0,0,.7);margin:0}
.up{display:block;text-align:center;background:#ff8a00;color:#fff;font-weight:700;font-size:16px;padding:12px;border-radius:14px;cursor:pointer}
.empty{grid-column:1/-1;text-align:center;padding:14px 0}
</style></head><body>
<div class="now"><span>현재 호출 <b id="cur">-</b></span><span id="hist"></span></div>
<div id="disp"></div>
<div class="pad">
<button onclick="k('1')">1</button><button onclick="k('2')">2</button><button onclick="k('3')">3</button>
<button onclick="k('4')">4</button><button onclick="k('5')">5</button><button onclick="k('6')">6</button>
<button onclick="k('7')">7</button><button onclick="k('8')">8</button><button onclick="k('9')">9</button>
<button onclick="del()">←</button><button onclick="k('0')">0</button><button onclick="v='';show()">C</button>
</div>
<button class="call" onclick="callNum()">호출</button>
<div class="row"><button onclick="api('/recall')">재호출</button><button onclick="next()">다음 번호</button><button onclick="api('/clear')">화면 비우기</button></div>
<div id="msg"></div>
<details id="imgbox"><summary>TV 이미지 (왼쪽 화면)</summary>
<div class="thumbs" id="thumbs"></div>
<label class="up">＋ 이미지 추가<input type="file" accept="image/*" multiple hidden onchange="upload(this.files);this.value=''"></label>
<br>슬라이드 넘김 간격 (초)<input id="slide" type="number" min="3" max="300">
표시 방식<select id="fit"><option value="contain">이미지 전체 보이기</option><option value="cover">화면 꽉 채우기 (가장자리 잘림)</option></select>
<button onclick="saveCfg()">저장</button>
<button onclick="if(confirm('TV 이미지를 모두 삭제할까요?'))api('/image/clear').then(loadThumbs)">이미지 모두 삭제</button>
</details>
<details><summary>호출 안내 설정</summary>
<br>음성 문구 ({n} 자리에 번호)<input id="tts">
팝업 안내 문구<input id="sub">
음성 반복 횟수 (0~5, 0이면 딩동만)<input id="rep" type="number" min="0" max="5">
팝업 표시 시간 (초)<input id="popup" type="number" min="3" max="60">
<button onclick="saveCfg()">저장</button>
</details>
<script>
var v='',last=0,loaded=false;
function $(i){return document.getElementById(i)}
function show(){$('disp').textContent=v}
function k(d){if(v.length<6){v+=d;show()}}
function del(){v=v.slice(0,-1);show()}
function msg(t){$('msg').textContent=t}
function render(s){
 $('cur').textContent=s.current||'-';
 $('hist').textContent=(s.history||[]).slice(0,4).join(' · ');
 if(!loaded){$('tts').value=s.tts;$('sub').value=s.sub;$('rep').value=s.repeat;$('slide').value=s.slide;$('popup').value=s.popup;$('fit').value=s.fit;loaded=true}
}
function api(p){return fetch(p).then(function(r){return r.json()}).then(function(s){render(s);if(!s.ok)msg(s.error||'오류');return s}).catch(function(){msg('TV에 연결할 수 없습니다')})}
function callNum(){if(!v){msg('번호를 입력하세요');return}var n=v;api('/call?n='+encodeURIComponent(n)).then(function(s){if(s&&s.ok){msg(n+'번 호출 완료');last=parseInt(n,10)||last;v='';show()}})}
function next(){v=String((last||parseInt($('cur').textContent,10)||0)+1);show()}
function saveCfg(){var q=['tts','sub'].map(function(i){return i+'='+encodeURIComponent($(i).value)});q.push('repeat='+$('rep').value,'slide='+$('slide').value,'popup='+$('popup').value,'fit='+$('fit').value);api('/config?'+q.join('&')).then(function(s){if(s&&s.ok)msg('설정 저장됨')})}
function loadThumbs(){fetch('/images').then(function(r){return r.json()}).then(function(d){var t=$('thumbs');t.innerHTML='';if(!d.images.length){t.innerHTML='<div class="empty">등록된 이미지가 없습니다</div>';return}
 d.images.forEach(function(n){var e=document.createElement('div');e.className='thumb';e.innerHTML='<img loading="lazy" src="/img/'+n+'"><button title="삭제">✕</button>';e.querySelector('button').onclick=function(){if(confirm('이 이미지를 삭제할까요?'))api('/image/delete?name='+n).then(loadThumbs)};t.appendChild(e)})}).catch(function(){})}
function resize(file){return new Promise(function(res,rej){var img=new Image();img.onload=function(){var m=1920,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,m/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);c.toBlob(function(b){b?res(b):rej()},'image/jpeg',0.88)};img.onerror=function(){rej()};img.src=URL.createObjectURL(file)})}
async function upload(files){var ok=0,err='';for(var i=0;i<files.length;i++){msg('이미지 보내는 중… '+(i+1)+'/'+files.length);try{var b=await resize(files[i]);var r=await fetch('/image',{method:'POST',headers:{'Content-Type':'image/jpeg'},body:b});var s=await r.json();if(s.ok)ok++;else err=s.error}catch(e){err='보내기 실패'}}msg(err?('이미지 '+ok+'장 추가 · 실패: '+err):('✔ 이미지 '+ok+'장 추가됨'));loadThumbs()}
$('imgbox').addEventListener('toggle',function(){if(this.open)loadThumbs()});
api('/status');setInterval(function(){fetch('/status').then(function(r){return r.json()}).then(render).catch(function(){})},3000);
</script></body></html>
