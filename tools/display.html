<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DID 호출 화면</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#111418;color:#f2f2f2;font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
body.idle{cursor:none}
.wrap{position:fixed;inset:0;padding:3vh;display:flex;flex-direction:column}
.main{flex:1;display:flex;gap:3vh;min-height:0}
.left{flex:8;position:relative;background:#000;border-radius:2.4vh;overflow:hidden;min-width:0}
.left img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .7s}
.left.cover img{object-fit:cover}
.left img.on{opacity:1}
#ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#9aa3ad;font-size:4vh;line-height:1.6;white-space:pre-line}
.right{flex:2;background:#1c2127;border-radius:2.4vh;padding:3vh 1.5vh;display:flex;flex-direction:column;align-items:center;min-width:0}
.lbl{color:#9aa3ad;font-weight:700;font-size:3.5vh;white-space:nowrap}
#cur{color:#ffcc33;font-weight:800;font-size:15vh;line-height:1.1;width:100%;text-align:center;white-space:nowrap;overflow:hidden}
.div{height:.3vh;background:#33404d;width:90%;margin:3vh 0 1.5vh}
#hist{flex:1;width:100%;display:flex;flex-direction:column;min-height:0}
#hist div{flex:1;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:7.5vh;white-space:nowrap;overflow:hidden}
.addr{color:#9aa3ad;font-size:2.3vh;padding-top:1.5vh;white-space:nowrap;overflow:hidden}
.addr.bad{color:#ff5a5a}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .3s}
#ov.show{display:flex}
#ov.vis{opacity:1}
#card{min-width:55vw;max-width:94vw;background:#ff8a00;border-radius:4vh;padding:3vh 6vh 4.5vh;text-align:center;color:#fff;box-shadow:0 2vh 6vh rgba(0,0,0,.5)}
#card.y{background:#ffcc33;color:#111418}
#card.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}
#pl{font-size:6vh;font-weight:700}
#pn{font-size:36vh;font-weight:800;line-height:1;white-space:nowrap}
#ps{font-size:5vh}
#start{position:fixed;inset:0;background:rgba(17,20,24,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;cursor:pointer;text-align:center}
#start[hidden]{display:none}
#start b{font-size:6vh;color:#ffcc33}
#start span{font-size:3vh;color:#9aa3ad;line-height:1.6}
</style></head><body>
<div class="wrap">
 <div class="main">
  <div class="left" id="left"><img id="ia" alt=""><img id="ib" alt=""><div id="ph">여기에 매장 이미지가 표시됩니다

휴대폰 브라우저 또는 호출기 앱에서 이미지를 추가하세요</div></div>
  <div class="right">
   <div class="lbl">현재 호출</div>
   <div id="cur">—</div>
   <div class="div"></div>
   <div class="lbl">최근 호출</div>
   <div id="hist"><div></div><div></div><div></div><div></div><div></div></div>
  </div>
 </div>
 <div class="addr" id="addr">연결 중…</div>
</div>
<div id="ov"><div id="card"><div id="pl">호출 번호</div><div id="pn"></div><div id="ps"></div></div></div>
<div id="start" hidden><b>화면을 클릭하면 시작합니다</b><span>소리(딩동·음성)를 켜고 전체화면으로 전환합니다.<br>윈도우 실행 파일(DID-Display.bat)로 열면 이 단계 없이 바로 시작됩니다.</span></div>
<script>
var S={},seq=null,imgs=[],imgKey='',idx=-1,front='ia',slideT=0,hideT=0,flashT=0,ac=null,voice=null,lastSlide=0,fails=0,speakT=0;
function $(i){return document.getElementById(i)}

// ── 소리 ──
function initAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=='running')ac.resume()}catch(e){}}
function synthChime(){var t0=ac.currentTime+.05;[[659.25,0],[523.25,.6]].forEach(function(n){[[1,.7],[2,.2],[3,.05]].forEach(function(h){var o=ac.createOscillator(),g=ac.createGain(),t=t0+n[1];o.frequency.value=n[0]*h[0];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(h[1]*.6,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+1.4);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+1.5)})})}
// 안드로이드 기기가 만든 소리 파일을 그대로 재생 (안드로이드 화면과 같은 소리)
var chimeBuf=null,voiceSrc=null,playId=0;
function loadBuf(url){return fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.arrayBuffer()}).then(function(a){return new Promise(function(ok,no){ac.decodeAudioData(a,ok,no)})})}
function playBuf(buf,done){var src=ac.createBufferSource();src.buffer=buf;src.connect(ac.destination);src.onended=done||null;src.start();return src}
function chime(){if(!ac||ac.state!=='running')return;if(chimeBuf){playBuf(chimeBuf);return}loadBuf('/chime.wav').then(function(b){chimeBuf=b;playBuf(b)}).catch(synthChime)}
function stopVoice(){playId++;try{if(voiceSrc){voiceSrc.onended=null;voiceSrc.stop()}}catch(e){}voiceSrc=null;if('speechSynthesis' in window)speechSynthesis.cancel()}
function announceVoice(n,text,rep){if(rep<=0)return;var id=++playId;
 if(!S.voice||!ac||ac.state!=='running'){speak(text,rep);return}
 loadBuf('/voice?n='+encodeURIComponent(n)).then(function(buf){if(id!==playId)return;(function play(k){if(k<=0||id!==playId)return;voiceSrc=playBuf(buf,function(){if(id===playId)speakT=setTimeout(function(){play(k-1)},800)})})(rep)}).catch(function(){if(id===playId)speak(text,rep)})}
function pickVoice(){if(!('speechSynthesis' in window))return;var v=speechSynthesis.getVoices().filter(function(x){return /^ko/i.test(x.lang)});voice=v.filter(function(x){return /Natural|Online/i.test(x.name)})[0]||v[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text,rep){if(!('speechSynthesis' in window)||rep<=0)return;speechSynthesis.cancel();(function say(k){if(k<=0)return;var u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';if(voice)u.voice=voice;u.rate=.95;u.onend=function(){speakT=setTimeout(function(){say(k-1)},800)};speechSynthesis.speak(u)})(rep)}

// ── 글자 크기 맞춤 ──
function fit(el,vh){var s=vh;el.style.fontSize=s+'vh';while(s>2&&el.scrollWidth>el.clientWidth){s*=.92;el.style.fontSize=s+'vh'}}

// ── 상태 반영 ──
function render(s){
 $('cur').textContent=s.current||'—';fit($('cur'),15);
 var h=s.history||[],d=$('hist').children;
 for(var i=0;i<d.length;i++){d[i].textContent=h[i]||'';d[i].style.opacity=1-i*.14;fit(d[i],7.5)}
 $('left').classList.toggle('cover',s.fit==='cover');
}
function apply(s){
 var prevSlide=S.slide;S=s;render(s);
 if(seq===null){seq=s.seq}else if(s.seq!==seq){seq=s.seq;if(s.current)announce(s.current)}
 if(!s.current)hidePopup();
 if(prevSlide!==undefined&&prevSlide!==s.slide)schedule();
 if(s.images!==imgs.length)loadImages();
}
function poll(){fetch('/status',{cache:'no-store'}).then(function(r){return r.json()}).then(function(s){fails=0;$('addr').className='addr';$('addr').textContent='● 연결됨  '+location.host+'   ·   전체화면 F11   ·   팝업 닫기 Esc';apply(s)}).catch(function(){if(++fails>=3){$('addr').className='addr bad';$('addr').textContent='● TV 기기('+location.host+')에 연결할 수 없습니다. 안드로이드 기기의 DID 앱이 켜져 있는지 확인하세요'}}).then(function(){setTimeout(poll,1000)})}

// ── 팝업 ──
function announce(n){
 var c=$('card'),ov=$('ov');
 $('pn').textContent=n;$('ps').textContent=S.sub||'';$('ps').style.display=(S.sub||'').trim()?'':'none';
 clearTimeout(hideT);clearInterval(flashT);clearTimeout(speakT);
 ov.classList.add('show');requestAnimationFrame(function(){ov.classList.add('vis')});
 c.classList.remove('pop','y');void c.offsetWidth;c.classList.add('pop');
 $('pn').style.fontSize=(n.length<=3?36:n.length==4?30:24)+'vh';
 var k=6;setTimeout(function(){flashT=setInterval(function(){if(k--<=0){clearInterval(flashT);c.classList.remove('y');return}c.classList.toggle('y')},380)},500);
 hideT=setTimeout(hidePopup,(S.popup||10)*1000);
 chime();
 var text=(S.tts||'{n}번 고객님').split('{n}').join(n);
 stopVoice();var vid=playId;speakT=setTimeout(function(){if(vid===playId)announceVoice(n,text,S.repeat==null?2:S.repeat)},1300);
}
function hidePopup(){var ov=$('ov');if(!ov.classList.contains('show'))return;clearTimeout(hideT);clearInterval(flashT);$('card').classList.remove('y');ov.classList.remove('vis');setTimeout(function(){if(!ov.classList.contains('vis'))ov.classList.remove('show')},320)}

// ── 이미지 슬라이드쇼 ──
function loadImages(){fetch('/images',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){var key=d.images.join('|');if(key===imgKey)return;imgKey=key;imgs=d.images;idx=-1;$('ph').style.display=imgs.length?'none':'flex';if(!imgs.length){$('ia').classList.remove('on');$('ib').classList.remove('on');clearTimeout(slideT);return}next()}).catch(function(){})}
function next(){clearTimeout(slideT);if(!imgs.length)return;idx=(idx+1)%imgs.length;var src='/img/'+imgs[idx],back=front==='ia'?'ib':'ia',pre=new Image();pre.onload=function(){$(back).src=src;$(back).classList.add('on');$(front).classList.remove('on');front=back};pre.src=src;schedule()}
function schedule(){clearTimeout(slideT);if(imgs.length>1)slideT=setTimeout(next,(S.slide||8)*1000)}

// ── 시작 / 전체화면 / 커서 숨김 ──
function start(){initAudio();$('start').hidden=true;var e=document.documentElement;if(e.requestFullscreen&&!document.fullscreenElement)e.requestFullscreen().catch(function(){});if('speechSynthesis' in window){var u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}}
initAudio();
setTimeout(function(){if(!ac||ac.state!=='running')$('start').hidden=false},300);
$('start').onclick=start;
document.addEventListener('keydown',function(e){if(!$('start').hidden){start();return}if(e.key==='Escape')hidePopup();if(e.key==='ArrowRight')next()});
var idleT;document.addEventListener('mousemove',function(){document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(function(){document.body.classList.add('idle')},3000)});
window.addEventListener('resize',function(){render(S)});
poll();loadImages();
</script></body></html>
