<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DID Display</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#111418;color:#f2f2f2;font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
body.idle{cursor:none}
.wrap{position:fixed;top:0;left:0;right:0;bottom:0;padding:1vh;display:flex;flex-direction:column}
.main{flex:1;display:flex;min-height:0}
.left{margin-right:1vh;flex:84;position:relative;background:#000;border-radius:1.2vh;overflow:hidden;min-width:0}
.left img{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .7s}
.left.cover img{object-fit:cover}
.left img.on{opacity:1}
#ph{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#9aa3ad;font-size:4vh;line-height:1.6;white-space:pre-line}
.right{flex:16;position:relative;background:#1c2127;border-radius:1.2vh;padding:2.5vh 1vh;display:flex;flex-direction:column;align-items:center;min-width:0}
.lbl{color:#9aa3ad;font-weight:700;font-size:3vh;white-space:nowrap}
#cur{color:#ffcc33;font-weight:800;font-size:13vh;line-height:1.1;width:100%;text-align:center;white-space:nowrap;overflow:hidden}
.div{height:.3vh;background:#33404d;width:90%;margin:2vh 0 1.5vh}
#hist{flex:1;width:100%;display:flex;flex-direction:column;min-height:0}
#hist div{flex:1;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:6.5vh;white-space:nowrap;overflow:hidden}
#dot{position:absolute;top:1.2vh;right:1.2vh;width:1.4vh;height:1.4vh;border-radius:50%;background:#666}
#dot.ok{background:#4cd964}
#dot.bad{background:#ff5a5a;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .3s}
#ov.show{display:flex}
#ov.vis{opacity:1}
#card{min-width:37vw;max-width:63vw;background:#ff8a00;border-radius:2.7vh;padding:2vh 4vh 3vh;text-align:center;color:#fff;box-shadow:0 2vh 6vh rgba(0,0,0,.5)}
#card.y{background:#ffcc33;color:#111418}
#card.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}
#pl{font-size:4vh;font-weight:700}
#pn{font-size:24vh;font-weight:800;line-height:1;white-space:nowrap}
#ps{font-size:3.3vh}
#start{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(17,20,24,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;text-align:center}
#start span{margin-top:2vh}
#start[hidden]{display:none}
#corner{position:fixed;top:0;left:0;width:9vh;height:9vh;z-index:50}
#menu{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}
#menu.show{display:flex}
#menu .box{background:#1c2127;border-radius:2vh;padding:3vh;text-align:center;min-width:40vh;box-shadow:0 2vh 6vh rgba(0,0,0,.5)}
#menu .t{color:#9aa3ad;font-size:2.6vh;margin-bottom:2vh}
#menu button{display:block;width:100%;margin-top:1.4vh;padding:2.2vh 4vh;border:0;border-radius:1.4vh;font-size:3.4vh;font-weight:700;color:#fff;background:#33404d;cursor:pointer;font-family:inherit}
#menu button:hover{filter:brightness(1.25)}
#menu button.x{background:#262b31;color:#9aa3ad;font-size:2.8vh}
#menu .m{color:#ffcc33;font-size:2.4vh;margin-top:1.6vh;min-height:3vh}
#start b{font-size:6vh;color:#ffcc33}
#start span{font-size:3vh;color:#9aa3ad;line-height:1.6}
</style></head><body>
<div class="wrap">
 <div class="main">
  <div class="left" id="left"><img id="ia" alt=""><img id="ib" alt=""><div id="ph">여기에 매장 이미지가 표시됩니다

휴대폰 브라우저 또는 호출기 앱에서 이미지를 추가하세요</div></div>
  <div class="right">
   <div id="dot" title="호출기 연결 상태"></div>
   <div class="lbl">현재 호출</div>
   <div id="cur">—</div>
   <div class="div"></div>
   <div class="lbl">최근 호출</div>
   <div id="hist"><div></div><div></div><div></div><div></div><div></div></div>
  </div>
 </div>
</div>
<div id="ov"><div id="card"><div id="pl">호출 번호</div><div id="pn"></div><div id="ps"></div></div></div>
<div id="corner"></div>
<div id="menu"><div class="box"><div class="t">호출 화면 메뉴</div>
<button id="mReload">새로고침</button><button id="mMin">최소화</button><button id="mExit">종료</button><button id="mCancel" class="x">닫기</button>
<div class="m" id="mMsg"></div></div></div>
<div id="start" hidden><b>화면을 클릭하면 시작합니다</b><span>소리(딩동·음성)를 켜고 전체화면으로 전환합니다.<br>윈도우 실행 파일(DID-Display.bat)로 열면 이 단계 없이 바로 시작됩니다.</span></div>
<script>
var APP=/[?&]app=1/.test(location.search),S={},seq=null,imgs=[],imgKey='',idx=-1,front='ia',slideT=0,hideT=0,flashT=0,ac=null,voice=null,lastSlide=0,fails=0,speakT=0;
function $(i){return document.getElementById(i)}

// ── 소리 ──
function initAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=='running')ac.resume()}catch(e){}}
function synthChime(){var t0=ac.currentTime+.05;[[659.25,0],[523.25,.6]].forEach(function(n){[[1,.7],[2,.2],[3,.05]].forEach(function(h){var o=ac.createOscillator(),g=ac.createGain(),t=t0+n[1];o.frequency.value=n[0]*h[0];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(h[1]*.6,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+1.4);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+1.5)})})}
// 안드로이드 기기가 만든 소리 파일을 그대로 재생 (안드로이드 화면과 같은 소리)
var chimeBuf=null,voiceSrc=null,playId=0;
function loadBuf(url){return fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.arrayBuffer()}).then(function(a){return new Promise(function(ok,no){ac.decodeAudioData(a,ok,no)})})}
function playBuf(buf,done){var src=ac.createBufferSource();src.buffer=buf;src.connect(ac.destination);src.onended=done||null;src.start();return src}
function chime(){if(!ac||ac.state!=='running')return;if(chimeBuf){playBuf(chimeBuf);return}loadBuf('/chime.wav').then(function(b){chimeBuf=b;playBuf(b)}).catch(synthChime)}
function stopVoice(){playId++;try{if(voiceSrc){voiceSrc.onended=null;voiceSrc.stop()}}catch(e){}voiceSrc=null;if('speechSynthesis' in window)speechSynthesis.cancel()}
function announceVoice(n,text,rep){if(rep<=0)return;var id=++playId;
 if(!S.voice||!ac||ac.state!=='running'){speak(text,rep);return}
 loadBuf('/voice?n='+encodeURIComponent(n)).then(function(buf){if(id!==playId)return;(function play(k){if(k<=0||id!==playId)return;voiceSrc=playBuf(buf,function(){if(id===playId)speakT=setTimeout(function(){play(k-1)},800)})})(rep)}).catch(function(){if(id===playId)speak(text,rep)})}
function pickVoice(){if(!('speechSynthesis' in window))return;var v=speechSynthesis.getVoices().filter(function(x){return /^ko/i.test(x.lang)});voice=v.filter(function(x){return /Natural|Online/i.test(x.name)})[0]||v[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text,rep){if(!('speechSynthesis' in window)||rep<=0)return;speechSynthesis.cancel();(function say(k){if(k<=0)return;var u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';if(voice)u.voice=voice;u.rate=.95;u.onend=function(){speakT=setTimeout(function(){say(k-1)},800)};speechSynthesis.speak(u)})(rep)}

// ── 글자 크기 맞춤 ──
function fit(el,vh){var s=vh;el.style.fontSize=s+'vh';while(s>2&&el.scrollWidth>el.clientWidth){s*=.92;el.style.fontSize=s+'vh'}}

// ── 상태 반영 ──
function render(s){
 $('cur').textContent=s.current||'—';fit($('cur'),13);
 var h=s.history||[],d=$('hist').children;
 for(var i=0;i<d.length;i++){d[i].textContent=h[i]||'';d[i].style.opacity=1-i*.14;fit(d[i],6.5)}
 $('left').classList.toggle('cover',s.fit==='cover');
}
function apply(s){
 var prevSlide=S.slide;S=s;render(s);
 if(seq===null){seq=s.seq}else if(s.seq!==seq){seq=s.seq;if(s.current)announce(s.current)}
 if(!s.current)hidePopup();
 if(prevSlide!==undefined&&prevSlide!==s.slide)schedule();
 if(s.images!==imgs.length)loadImages();
}
function poll(){fetch('/status?d=1',{cache:'no-store'}).then(function(r){return r.json()}).then(function(s){fails=0;$('dot').className='ok';apply(s)}).catch(function(){if(++fails>=3){$('dot').className='bad'}}).then(function(){setTimeout(poll,1000)})}

// ── 팝업 ──
function announce(n){
 var c=$('card'),ov=$('ov');
 $('pn').textContent=n;$('ps').textContent=S.sub||'';$('ps').style.display=(S.sub||'').trim()?'':'none';
 clearTimeout(hideT);clearInterval(flashT);clearTimeout(speakT);
 ov.classList.add('show');requestAnimationFrame(function(){ov.classList.add('vis')});
 c.classList.remove('pop','y');void c.offsetWidth;c.classList.add('pop');
 $('pn').style.fontSize=(n.length<=3?24:n.length==4?20:16)+'vh';
 var k=6;setTimeout(function(){flashT=setInterval(function(){if(k--<=0){clearInterval(flashT);c.classList.remove('y');return}c.classList.toggle('y')},380)},500);
 hideT=setTimeout(hidePopup,(S.popup||10)*1000);
 chime();
 var text=(S.tts||'{n}번 고객님').split('{n}').join(n);
 stopVoice();var vid=playId;speakT=setTimeout(function(){if(vid===playId)announceVoice(n,text,S.repeat==null?2:S.repeat)},1300);
}
function hidePopup(){var ov=$('ov');if(!ov.classList.contains('show'))return;clearTimeout(hideT);clearInterval(flashT);$('card').classList.remove('y');ov.classList.remove('vis');setTimeout(function(){if(!ov.classList.contains('vis'))ov.classList.remove('show')},320)}

// ── 이미지 슬라이드쇼 ──
function loadImages(){fetch('/images',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){var key=d.images.join('|');if(key===imgKey)return;imgKey=key;imgs=d.images;idx=-1;$('ph').style.display=imgs.length?'none':'flex';if(!imgs.length){$('ia').classList.remove('on');$('ib').classList.remove('on');clearTimeout(slideT);return}next()}).catch(function(){})}
function next(){clearTimeout(slideT);if(!imgs.length)return;idx=(idx+1)%imgs.length;var src='/img/'+imgs[idx],back=front==='ia'?'ib':'ia',pre=new Image();pre.onload=function(){$(back).src=src;$(back).classList.add('on');$(front).classList.remove('on');front=back};pre.src=src;schedule()}
function schedule(){clearTimeout(slideT);if(imgs.length>1)slideT=setTimeout(next,(S.slide||8)*1000)}

// ── 시작 / 전체화면 / 커서 숨김 ──
function start(){initAudio();$('start').hidden=true;var e=document.documentElement;try{if(!APP&&e.requestFullscreen&&!document.fullscreenElement){var fp=e.requestFullscreen();if(fp&&fp.catch)fp.catch(function(){})}}catch(x){}if('speechSynthesis' in window){var u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}}
initAudio();
setTimeout(function(){if(!ac||ac.state!=='running')$('start').hidden=false},300);
$('start').onclick=start;
document.addEventListener('keydown',function(e){if(!$('start').hidden){start();return}if(e.key==='Escape')hidePopup();if(e.key==='ArrowRight')next()});
var idleT;document.addEventListener('mousemove',function(){document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(function(){document.body.classList.add('idle')},3000)});
window.addEventListener('resize',function(){render(S)});
// ── 숨은 메뉴: 왼쪽 위 모서리를 빠르게 3번 클릭 → 새로고침 / 최소화 / 종료 ──
var cornerHits=[],menuT=0;
$('corner').addEventListener('click',function(){var now=Date.now();cornerHits.push(now);cornerHits=cornerHits.filter(function(t){return now-t<1500});if(cornerHits.length>=3){cornerHits=[];openMenu()}});
function openMenu(){$('mMsg').textContent='';$('mMin').style.display=APP?'none':'';$('mExit').style.display=APP?'none':'';$('menu').classList.add('show');clearTimeout(menuT);menuT=setTimeout(closeMenu,15000)}
function closeMenu(){clearTimeout(menuT);$('menu').classList.remove('show')}
function helper(cmd){return fetch('http://127.0.0.1:8799/'+cmd+'?t='+Date.now(),{mode:'no-cors',cache:'no-store'})}
$('mCancel').onclick=closeMenu;
$('menu').addEventListener('click',function(e){if(e.target===this)closeMenu()});
$('mReload').onclick=function(){location.reload()};
$('mMin').onclick=function(){helper('min').then(closeMenu).catch(function(){
 if(document.fullscreenElement&&document.exitFullscreen){document.exitFullscreen();closeMenu();return}
 $('mMsg').textContent='최소화는 윈도우 실행 파일(DID-Display.bat)로 열었을 때 됩니다'})};
$('mExit').onclick=function(){helper('close').then(function(){setTimeout(function(){$('mMsg').textContent='종료되지 않으면 Alt+F4 를 누르세요'},1500)}).catch(function(){
 try{window.close()}catch(x){}setTimeout(function(){$('mMsg').textContent='Alt+F4 를 누르면 종료됩니다'},400)})};
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('menu').classList.contains('show'))closeMenu()},true);
poll();loadImages();
</script></body></html>
