<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DID Display</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
body.idle{cursor:none}
/* ── 색: 선명(기본) ── */
body{--bg:#000;--panel:#101318;--line:#2b3138;--label:#d5dbe2;--cur:#ffd400;--num:#fff;--ph:#9aa3ad;--card:#ff8a00;--card2:#ffd400}
/* ── 색: 차분 ── */
body.calm{--bg:#111418;--panel:#1c2127;--line:#33404d;--label:#9aa3ad;--cur:#ffcc33;--num:#f2f2f2;--card:#ff8a00;--card2:#ffcc33}
body{background:var(--bg)}
.wrap{position:fixed;top:0;left:0;right:0;bottom:0;padding:1vh;display:flex;flex-direction:column}
.main{flex:1;display:flex;min-height:0}
.left{margin-right:1vh;flex:84;position:relative;background:#000;border-radius:1.2vh;overflow:hidden;min-width:0}
.left img,.left video{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .7s;background:#000}
.left.cover img,.left.cover video{object-fit:cover}
.left img.on,.left video.on{opacity:1}
#ph{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ph);font-size:4vh;line-height:1.6;white-space:pre-line}
.right{flex:16;position:relative;background:var(--panel);border-radius:1.2vh;padding:2.5vh 1vh;display:flex;flex-direction:column;align-items:center;min-width:0}
.sec{width:100%;display:flex;flex-direction:column;align-items:center;min-height:0}
#secHist{flex:1;border-top:.3vh solid var(--line);margin-top:2vh;padding-top:1.5vh}
.lbl{color:var(--label);font-weight:700;font-size:3vh;white-space:nowrap}
#cur{color:var(--cur);font-weight:800;font-size:13vh;line-height:1.1;width:100%;text-align:center;white-space:nowrap;overflow:hidden}
#hist{flex:1;width:100%;display:flex;flex-direction:column;min-height:0}
#hist div{flex:1;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:6.5vh;white-space:nowrap;overflow:hidden;color:var(--num)}
#hist div:nth-child(n+6){display:none}
body.calm #hist div:nth-child(2){opacity:.86}body.calm #hist div:nth-child(3){opacity:.72}body.calm #hist div:nth-child(4){opacity:.58}body.calm #hist div:nth-child(5){opacity:.44}
/* ── 키오스크 연동(조리중) 모드: 위 = 현재 호출(첫 번호 강조) + 최근, 아래 = 조리중 — 한 줄에 2개 ── */
#secWait{display:none}
.g2{flex:1;width:100%;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;min-height:0}
.g2 div{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:5.5vh;white-space:nowrap;overflow:hidden;color:var(--num)}
.g2 div.now,#hist div.now{color:var(--cur)}
#wait div{color:var(--label)}
.more{color:var(--label);font-size:2.4vh;font-weight:700;margin-left:.6vh}
body.kiosk .left{flex:80}
body.kiosk .right{flex:20}
body.kiosk #secCur{display:none}
body.kiosk #secHist{flex:1;border-top:0;margin-top:0;padding-top:0}
body.kiosk #secWait{display:flex;flex:1;border-top:.3vh solid var(--line);margin-top:1.5vh;padding-top:1vh}
body.kiosk #hist{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr}
body.kiosk #hist div{display:flex!important;opacity:1!important;font-size:5.5vh}
#dot{position:absolute;top:1.2vh;right:1.2vh;width:1.4vh;height:1.4vh;border-radius:50%;background:#666}
#dot.ok{background:#4cd964}
#dot.bad{background:#ff5a5a;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
/* ── 세로 화면: 위 이미지 / 아래 칸 = 현재 호출 → 구분선 → 최근 호출(한 줄에 2개) ── */
@media (orientation:portrait){
 .main{flex-direction:column}
 .left{margin-right:0;margin-bottom:1vh;flex:64}
 .right{flex:36;padding:1.6vh 3vw}
 .sec{justify-content:center}
 #secCur{flex:40}
 #secHist{flex:60;margin-top:1vh;padding-top:1vh}
 .lbl{font-size:2.3vh}
 #cur{font-size:10vh}
 #hist{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr}
 #hist div{font-size:5vh}
 #hist div:nth-child(n+5){display:none}
 /* 세로 팝업: 가로 화면 팝업과 비슷한 실제 크기 */
 #card{min-width:56vw!important;max-width:80vw!important;padding:1.4vh 3vw 2vh!important;border-radius:1.8vh!important}
 #pl{font-size:2.6vh!important}
 #ps{font-size:2.2vh!important}
 body.kiosk #secCur{display:flex;flex:36;min-height:0}
 body.kiosk #cur{flex:none;line-height:1.2}
 body.kiosk #secHist{display:none}
 body.kiosk #secWait{flex:66;margin-top:1vh}
 body.kiosk #wait{grid-template-columns:1fr 1fr 1fr 1fr}
 #start b{font-size:3.6vh}
 #start span{font-size:2vh}
}
/* ── 호출 팝업 ── */
#ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;z-index:20}
#ov.show{display:flex}
#ov.vis{opacity:1}
#card{min-width:37vw;max-width:63vw;background:var(--card);border-radius:2.7vh;padding:2vh 4vh 3vh;text-align:center;color:#fff;box-shadow:0 2vh 6vh rgba(0,0,0,.5)}
#card.y{background:var(--card2);color:#111418}
#card.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}
#pl{font-size:4vh;font-weight:700}
#pn{font-size:24vh;font-weight:800;line-height:1;white-space:nowrap;overflow:hidden;width:100%}
#ps{font-size:3.3vh}
/* ── 영업 마감 ── */
#closed{position:fixed;top:0;left:0;right:0;bottom:0;z-index:15;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6vh}
#closed.show{display:flex}
#closed .ic{font-size:10vh;margin-bottom:3vh}
#closed .msg{font-size:6vh;font-weight:800;line-height:1.4;color:#fff;white-space:pre-line;max-width:90vw}
#closed .sub{font-size:3vh;color:var(--label);margin-top:3vh}
/* ── 시작 / 메뉴 ── */
#start{position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;background:rgba(17,20,24,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;text-align:center}
#start[hidden]{display:none}
#start b{font-size:6vh;color:#ffcc33}
#start span{margin-top:2vh;font-size:3vh;color:#9aa3ad;line-height:1.6}
#corner{position:fixed;top:0;left:0;width:9vh;height:9vh;z-index:50}
#menu{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}
#menu.show{display:flex}
#menu .box{background:#1c2127;border-radius:2vh;padding:3vh;text-align:center;min-width:40vh;max-width:90vw;box-shadow:0 2vh 6vh rgba(0,0,0,.5)}
#menu .t{color:#9aa3ad;font-size:2.6vh;margin-bottom:2vh}
#menu button{display:block;width:100%;margin-top:1.4vh;padding:2.2vh 4vh;border:0;border-radius:1.4vh;font-size:3.4vh;font-weight:700;color:#fff;background:#33404d;cursor:pointer;font-family:inherit}
#menu button:hover{filter:brightness(1.25)}
#menu button.x{background:#262b31;color:#9aa3ad;font-size:2.8vh}
#menu .m{color:#ffcc33;font-size:2.4vh;margin-top:1.6vh;min-height:3vh}
#menu .info{color:#9aa3ad;font-size:2.2vh;margin-top:1.6vh;line-height:1.5}
</style></head><body>
<div class="wrap">
 <div class="main">
  <div class="left" id="left"><img id="ia" alt=""><img id="ib" alt=""><video id="vv" playsinline muted preload="auto"></video><div id="ph">여기에 매장 이미지·동영상이 표시됩니다

휴대폰 브라우저 또는 호출기 앱에서 추가하세요</div></div>
  <div class="right">
   <div id="dot" title="호출기 연결 상태"></div>
   <div class="sec" id="secCur"><div class="lbl">현재 호출</div><div id="cur">—</div></div>
   <div class="sec" id="secHist"><div class="lbl" id="histLbl">최근 호출</div><div id="hist"><div></div><div></div><div></div><div></div><div></div><div></div></div></div>
   <div class="sec" id="secWait"><div class="lbl">조리중<span class="more" id="waitMore"></span></div><div id="wait" class="g2"></div></div>
  </div>
 </div>
</div>
<div id="closed"><div class="ic">🌙</div><div class="msg" id="closedMsg"></div><div class="sub" id="closedSub"></div></div>
<div id="ov"><div id="card"><div id="pl">호출 번호</div><div id="pn"></div><div id="ps"></div></div></div>
<div id="corner"></div>
<div id="menu"><div class="box"><div class="t">호출 화면 메뉴</div>
<button id="mReload">새로고침</button><button id="mRot">화면 회전 (세로 거치)</button><button id="mMin">최소화</button><button id="mExit">종료</button><button id="mCancel" class="x">닫기</button>
<div class="m" id="mMsg"></div><div class="info" id="mInfo"></div></div></div>
<div id="start" hidden><b>화면을 클릭하면 시작합니다</b><span>소리(딩동·음성)를 켜고 전체화면으로 전환합니다.<br>윈도우 실행 파일(DID-Display.bat)로 열면 이 단계 없이 바로 시작됩니다.</span></div>
<script>
// ── 화면 회전 (세로로 단 TV): 회전이 설정돼 있으면 이 페이지를 돌린 틀(iframe) 안에 다시 띄움 ──
var PARAMS=location.search,APP=/[?&]app=1/.test(PARAMS),INNER=/[?&]inner=1/.test(PARAMS);
function getRot(){var m=/[?&]rot=(0|90|270)/.exec(PARAMS);if(m)return +m[1];try{return +(localStorage.getItem('didRot')||0)}catch(e){return 0}}
function setRot(r){if(window.top!==window&&window.top.setRot){window.top.setRot(r);return}try{localStorage.setItem('didRot',String(r))}catch(e){}location.href='/display'+(APP?'?app=1':'')}
var ROT=INNER?0:getRot();
if(ROT===90||ROT===270){
 document.body.innerHTML='';document.body.style.background='#000';
 var f=document.createElement('iframe');f.src='/display?inner=1'+(APP?'&app=1':'');f.setAttribute('allow','autoplay');
 f.style.cssText='position:fixed;top:0;left:0;border:0;width:100vh;height:100vw;transform-origin:0 0;transform:'+(ROT===90?'translateX(100vw) rotate(90deg)':'translateY(100vh) rotate(-90deg)');
 document.body.appendChild(f);
 window.next=function(){try{f.contentWindow.next()}catch(e){}};
} else (function(){
var S={},seq=null,closeSeq=null,items=[],mediaVer=null,idx=-1,front='ia',slideT=0,hideT=0,flashT=0,ac=null,voice=null,fails=0,speakT=0;
function $(i){return document.getElementById(i)}

// ── 소리: 호출기 폰이 만든 알림음·음성 파일을 그대로 재생 (TV·PC 모두 같은 소리) ──
function initAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=='running')ac.resume()}catch(e){}}
function synthChime(){var t0=ac.currentTime+.05;[[659.25,0],[523.25,.6]].forEach(function(n){[[1,.7],[2,.2],[3,.05]].forEach(function(h){var o=ac.createOscillator(),g=ac.createGain(),t=t0+n[1];o.frequency.value=n[0]*h[0];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(h[1]*.6,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+1.4);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+1.5)})})}
var chimeBuf=null,chimeKey='',voiceSrc=null,playId=0;
function loadBuf(url){return fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.arrayBuffer()}).then(function(a){return new Promise(function(ok,no){ac.decodeAudioData(a,ok,no)})})}
function playBuf(buf,done){var src=ac.createBufferSource();src.buffer=buf;src.connect(ac.destination);src.onended=done||null;src.start();return src}
function chime(){if(!ac||ac.state!=='running')return;var key=(S.chime||'')+'/'+(S.chimeVer||0);if(chimeBuf&&key===chimeKey){playBuf(chimeBuf);return}
 loadBuf('/chime?v='+encodeURIComponent(key)).then(function(b){chimeBuf=b;chimeKey=key;playBuf(b)}).catch(synthChime)}
function stopVoice(){playId++;try{if(voiceSrc){voiceSrc.onended=null;voiceSrc.stop()}}catch(e){}voiceSrc=null;if('speechSynthesis' in window)speechSynthesis.cancel()}
function playVoice(url,text,rep){if(rep<=0)return;var id=++playId;
 if(!S.voice||!ac||ac.state!=='running'){speak(text,rep);return}
 loadBuf(url).then(function(buf){if(id!==playId)return;(function play(k){if(k<=0||id!==playId)return;voiceSrc=playBuf(buf,function(){if(id===playId)speakT=setTimeout(function(){play(k-1)},800)})})(rep)}).catch(function(){if(id===playId)speak(text,rep)})}
function pickVoice(){if(!('speechSynthesis' in window))return;var v=speechSynthesis.getVoices().filter(function(x){return /^ko/i.test(x.lang)});voice=v.filter(function(x){return /Natural|Online/i.test(x.name)})[0]||v[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text,rep){if(!('speechSynthesis' in window)||rep<=0)return;speechSynthesis.cancel();(function say(k){if(k<=0)return;var u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';if(voice)u.voice=voice;u.rate=.95;u.onend=function(){speakT=setTimeout(function(){say(k-1)},800)};speechSynthesis.speak(u)})(rep)}

// ── 글자 크기 맞춤 ──
function fit(el,vh){var s=vh;el.style.fontSize=s+'vh';while(s>2&&el.scrollWidth>el.clientWidth){s*=.92;el.style.fontSize=s+'vh'}}
function portrait(){return window.innerHeight>window.innerWidth}

// ── 상태 반영 ──
function render(s){
 document.body.classList.toggle('calm',s.theme==='calm');
 var kiosk=!!s.kioskOn;document.body.classList.toggle('kiosk',kiosk);
 $('cur').textContent=s.current||'—';fit($('cur'),portrait()?(kiosk?7:10):13);
 $('histLbl').textContent=kiosk?'현재 호출':'최근 호출';
 var h=s.history||[],d=$('hist').children;
 // 키오스크 모드: '현재 호출' 칸 = 방금 부른 번호(노란색) + 최근 호출, 한 줄에 2개
 var list=kiosk?(s.current?[s.current]:[]).concat(h):h;
 for(var i=0;i<d.length;i++){d[i].textContent=list[i]||'';d[i].className=(kiosk&&i===0&&s.current)?'now':'';fit(d[i],kiosk?5.5:(portrait()?5:6.5))}
 renderWait(s.waiting||[]);
 $('left').classList.toggle('cover',s.fit==='cover');
 $('closedMsg').textContent=s.closeMsg||'';
 $('closedSub').textContent=s.closeOn&&s.open?('영업 시간  '+s.open+' ~ '+s.close):'';
 $('closed').classList.toggle('show',!!s.closed);
 $('vv').muted=!s.videoSound;
}
// 조리중: 들어온 순서대로, 넘치면 "+N"
function renderWait(w){var box=$('wait'),max=8;while(box.children.length<max)box.appendChild(document.createElement('div'));
 for(var i=0;i<max;i++){var c=box.children[i];c.textContent=w[i]?w[i].n:'';fit(c,portrait()?4.5:5.5)}
 $('waitMore').textContent=w.length>max?('  +'+(w.length-max)):(w.length?'  '+w.length+'건':'')}
function apply(s){
 var prevSlide=S.slide;S=s;render(s);
 if(seq===null){seq=s.seq}else if(s.seq!==seq){seq=s.seq;if(s.current)announce(s.current)}
 if(closeSeq===null){closeSeq=s.closeSeq}else if(s.closeSeq!==closeSeq){closeSeq=s.closeSeq;if(s.closed)announceClosing()}
 if(!s.current)hidePopup();
 if(prevSlide!==undefined&&prevSlide!==s.slide)schedule();
 if(s.mediaVer!==mediaVer){mediaVer=s.mediaVer;loadMedia()}
}
function poll(){fetch('/status?d=1',{cache:'no-store'}).then(function(r){return r.json()}).then(function(s){fails=0;$('dot').className='ok';apply(s)}).catch(function(){if(++fails>=3){$('dot').className='bad'}}).then(function(){setTimeout(poll,1000)})}

// ── 호출 팝업 ──
function announce(n){
 var c=$('card'),ov=$('ov');
 $('pn').textContent=n;$('ps').textContent=S.sub||'';$('ps').style.display=(S.sub||'').trim()?'':'none';
 clearTimeout(hideT);clearInterval(flashT);clearTimeout(speakT);
 ov.classList.add('show');requestAnimationFrame(function(){ov.classList.add('vis')});
 c.classList.remove('pop','y');void c.offsetWidth;c.classList.add('pop');
 var base=portrait()?14:24;fit($('pn'),n.length<=3?base:n.length==4?base*.84:base*.67);
 var k=6;setTimeout(function(){flashT=setInterval(function(){if(k--<=0){clearInterval(flashT);c.classList.remove('y');return}c.classList.toggle('y')},380)},500);
 hideT=setTimeout(hidePopup,(S.popup||10)*1000);
 duck(true);
 chime();
 var text=(S.tts||'{n}번 고객님').split('{n}').join(n);
 stopVoice();var vid=playId;speakT=setTimeout(function(){if(vid===playId)playVoice('/voice?n='+encodeURIComponent(n),text,S.repeat==null?2:S.repeat)},1300);
}
function hidePopup(){var ov=$('ov');if(!ov.classList.contains('show'))return;clearTimeout(hideT);clearInterval(flashT);$('card').classList.remove('y');ov.classList.remove('vis');duck(false);setTimeout(function(){if(!ov.classList.contains('vis'))ov.classList.remove('show')},320)}
// 동영상 소리를 켠 경우 호출 안내 중에는 작게
function duck(on){var v=$('vv');try{v.volume=on?.12:1}catch(e){}}
// ── 영업 마감 안내 ──
function announceClosing(){hidePopup();chime();stopVoice();var vid=playId;speakT=setTimeout(function(){if(vid===playId)playVoice('/voice/closing?v='+closeSeq,S.closeMsg||'',1)},1300)}

// ── 이미지·동영상 슬라이드쇼 ──
function loadMedia(){fetch('/media',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
 var list=d.items||[];var key=list.map(function(x){return x.name}).join('|');
 if(key===items.map(function(x){return x.name}).join('|'))return;
 items=list;idx=-1;$('ph').style.display=items.length?'none':'flex';
 if(!items.length){$('ia').classList.remove('on');$('ib').classList.remove('on');stopVideo();clearTimeout(slideT);return}
 next()}).catch(function(){})}
function stopVideo(){var v=$('vv');v.classList.remove('on');v.onended=null;v.onerror=null;try{v.pause()}catch(e){}}
function next(){clearTimeout(slideT);if(!items.length)return;idx=(idx+1)%items.length;var it=items[idx],src='/m/'+it.name;
 if(it.video){showVideo(src);return}
 var back=front==='ia'?'ib':'ia',pre=new Image();
 pre.onload=function(){$(back).src=src;$(back).classList.add('on');$(front).classList.remove('on');front=back;stopVideo()};
 pre.onerror=function(){schedule()};pre.src=src;schedule()}
window.next=next;
function showVideo(src){var v=$('vv');v.muted=!S.videoSound;v.loop=items.length===1;
 v.onended=function(){next()};v.onerror=function(){slideT=setTimeout(next,1000)};
 if(v.getAttribute('src')!==src){v.src=src}else{try{v.currentTime=0}catch(e){}}
 var p=v.play();if(p&&p.catch)p.catch(function(){v.muted=true;var p2=v.play();if(p2&&p2.catch)p2.catch(function(){slideT=setTimeout(next,3000)})});
 v.classList.add('on');$('ia').classList.remove('on');$('ib').classList.remove('on')}
function schedule(){clearTimeout(slideT);if(items.length>1)slideT=setTimeout(next,(S.slide||8)*1000)}

// ── 시작 / 전체화면 / 커서 숨김 ──
function start(){initAudio();$('start').hidden=true;var e=document.documentElement;try{if(!APP&&!INNER&&e.requestFullscreen&&!document.fullscreenElement){var fp=e.requestFullscreen();if(fp&&fp.catch)fp.catch(function(){})}}catch(x){}if('speechSynthesis' in window){var u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}var v=$('vv');if(v.classList.contains('on')&&v.paused){var p=v.play();if(p&&p.catch)p.catch(function(){})}}
initAudio();
setTimeout(function(){if(!ac||ac.state!=='running')$('start').hidden=false},300);
$('start').onclick=start;
document.addEventListener('keydown',function(e){if(!$('start').hidden){start();return}if(e.key==='Escape')hidePopup();if(e.key==='ArrowRight')next()});
var idleT;document.addEventListener('mousemove',function(){document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(function(){document.body.classList.add('idle')},3000)});
window.addEventListener('resize',function(){render(S)});

// ── 숨은 메뉴: 왼쪽 위 모서리를 빠르게 3번 클릭 → 새로고침 / 회전 / 최소화 / 종료 ──
var cornerHits=[],menuT=0;
$('corner').addEventListener('click',function(){var now=Date.now();cornerHits.push(now);cornerHits=cornerHits.filter(function(t){return now-t<1500});if(cornerHits.length>=3){cornerHits=[];openMenu()}});
function screenInfo(){var r=window.devicePixelRatio||1,w=window.innerWidth,h=window.innerHeight;
 return '화면 정보: '+Math.round(w*r)+'×'+Math.round(h*r)+' 픽셀 (배율 '+(Math.round(r*100)/100)+')'+(Math.max(w*r,h*r)<1600?'  ⚠ 720p 이하로 그리는 기기 — 흐려 보일 수 있음':'')}
function openMenu(){$('mMsg').textContent='';$('mInfo').textContent=screenInfo()+'  ·  회전 '+getRot()+'°';
 $('mMin').style.display=APP?'none':'';$('mExit').style.display=APP?'none':'';$('menu').classList.add('show');clearTimeout(menuT);menuT=setTimeout(closeMenu,15000)}
function closeMenu(){clearTimeout(menuT);$('menu').classList.remove('show')}
function helper(cmd){return fetch('http://127.0.0.1:8799/'+cmd+'?t='+Date.now(),{mode:'no-cors',cache:'no-store'})}
$('mCancel').onclick=closeMenu;
$('menu').addEventListener('click',function(e){if(e.target===this)closeMenu()});
$('mReload').onclick=function(){(window.top!==window?window.top:window).location.reload()};
$('mRot').onclick=function(){var r=getRot();setRot(r===0?90:r===90?270:0)};
$('mMin').onclick=function(){helper('min').then(closeMenu).catch(function(){
 if(document.fullscreenElement&&document.exitFullscreen){document.exitFullscreen();closeMenu();return}
 $('mMsg').textContent='최소화는 윈도우 실행 파일(DID-Display.bat)로 열었을 때 됩니다'})};
$('mExit').onclick=function(){helper('close').then(function(){setTimeout(function(){$('mMsg').textContent='종료되지 않으면 Alt+F4 를 누르세요'},1500)}).catch(function(){
 try{window.top.close()}catch(x){}setTimeout(function(){$('mMsg').textContent='Alt+F4 를 누르면 종료됩니다'},400)})};
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('menu').classList.contains('show'))closeMenu()},true);
window.screenInfo=screenInfo;
poll();
})();
